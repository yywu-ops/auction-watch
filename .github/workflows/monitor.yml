name: Yahoo 新品監控

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = 檢查賣場；test-email = 寄測試信'
        type: choice
        options:
          - check
          - test-email
        default: check

permissions:
  contents: write

concurrency:
  group: auction-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安裝瀏覽器
        if: inputs.mode != 'test-email'
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: 執行
        env:
          BOOTH_URL: ${{ secrets.BOOTH_URL }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RUN_MODE" = "test-email" ]; then
            python monitor.py --test-email
          else
            python monitor.py
          fi
      - name: 儲存匿名商品紀錄
        if: inputs.mode != 'test-email'
        run: |
          if [[ -n "$(git status --porcelain -- seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update anonymous product records"
            git push
          fi
